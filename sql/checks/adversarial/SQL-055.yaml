# Source FIXTURE (all events at 2025-12-01 12:00 UTC), hand-computed:
#  first-LOADED delays: evt-fx-001..020 = 0,30,...,570 s; evt-fx-021 = -45 (skew); evt-fx-022 = 620 (RETRIED at +20 then LOADED);
#  evt-fx-023 REJECTED only (absent); evt-fx-024 = 15 (+ a later DUPLICATE at 75); evt-fx-025 = 172800 (2 days).
#  23 usable values sorted: 0,15,30,60,...,570,620,172800 -> p50 = 300 (12th value), p95 = 570 + 0.9*(620-570) = 615.
assertions:
  - name: "FIXTURE has 23 usable events (20 regular + retried + duplicate-affected + 2-day-late; REJECTED-only excluded)"
    row: {source_system: FIXTURE}
    expect: {loaded_events: 23}
  - name: "FIXTURE counts exactly one skewed (negative delay) event"
    row: {source_system: FIXTURE}
    expect: {skewed_events_excluded: 1}
  - name: "FIXTURE p50 is 300.00 (negative -45 excluded, retry counted at its LOADED delay 620, duplicate row ignored)"
    row: {source_system: FIXTURE}
    expect: {p50_delay_s: 300.00}
  - name: "FIXTURE p95 is 615.00 (continuous percentile; nearest-rank would give 570; including the -45 skew would shift it)"
    row: {source_system: FIXTURE}
    expect: {p95_delay_s: 615.00}
  - name: "FIXTURE appears exactly once"
    present: {source_system: FIXTURE}
    count: 1
  - name: "APP source is reported with a non-negative p50 below its p95"
    sql: "SELECT bool_and(p50_delay_s >= 0 AND p50_delay_s <= p95_delay_s) FROM ({student}) s WHERE source_system = 'APP'"
  - name: "every row has p50 <= p95 and a positive loaded_events count"
    sql: "SELECT bool_and(p50_delay_s <= p95_delay_s AND loaded_events > 0) FROM ({student}) s"
  - name: "loaded_events + skewed_events_excluded equals the number of distinct events with a LOADED row in the window, per source"
    sql: >-
      SELECT bool_and(s.loaded_events + s.skewed_events_excluded = d.n)
      FROM ({student}) s
      JOIN (SELECT source_system, count(DISTINCT raw_event_id) AS n FROM event_ingestion_log
            WHERE ingestion_status = 'LOADED' AND event_ts >= TIMESTAMPTZ '2025-12-01 00:00:00+00' AND event_ts < TIMESTAMPTZ '2026-01-01 00:00:00+00'
            GROUP BY source_system) d USING (source_system)
