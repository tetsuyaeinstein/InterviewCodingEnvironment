# Hand-written, fixture-based assertions (independent of the reference solution).
assertions:
  - name: "KIOSK-F01: overlapping, nested and touching incidents merge to [08:00, 10:15) + [12:00, 12:30) = 165 minutes, 2 outages"
    row: {device_id: KIOSK-F01}
    count: 1
    expect: {outage_count: 2, downtime_minutes: 165.00}
  - name: "KIOSK-F02: two identical incidents across midnight count once = 60 minutes, 1 outage"
    row: {device_id: KIOSK-F02}
    expect: {outage_count: 1, downtime_minutes: 60.00}
  - name: "KIOSK-F03: a single 20-minute incident"
    row: {device_id: KIOSK-F03}
    expect: {outage_count: 1, downtime_minutes: 20.00}
  - name: "KIOSK-0013: an incident from 01-31 20:55:19 to 02-01 01:50:01 counts only until 2025-02-01 00:00 (184.68 minutes)"
    profile: small
    row: {device_id: KIOSK-0013}
    expect: {outage_count: 1, downtime_minutes: 184.68}
  - name: "one row per device, and merged downtime never exceeds the raw incident minutes inside January"
    sql: >-
      SELECT count(*) = count(DISTINCT s.device_id)
             AND bool_and(s.downtime_minutes <= r.raw_minutes + 0.01 AND s.outage_count >= 1)
      FROM ({student}) s
      JOIN (SELECT device_id,
                   sum(extract(epoch FROM least(down_to, TIMESTAMPTZ '2025-02-01 00:00:00+00')
                                     - greatest(down_from, TIMESTAMPTZ '2025-01-01 00:00:00+00'))) / 60 AS raw_minutes
            FROM device_downtime_incidents
            WHERE down_from < TIMESTAMPTZ '2025-02-01 00:00:00+00'
              AND down_to   > TIMESTAMPTZ '2025-01-01 00:00:00+00'
            GROUP BY device_id) r ON r.device_id = s.device_id
  - name: "every device with a January incident is listed, and no other device"
    sql: >-
      SELECT (SELECT count(*) FROM ({student}) s)
           = (SELECT count(DISTINCT device_id) FROM device_downtime_incidents
              WHERE down_from < TIMESTAMPTZ '2025-02-01 00:00:00+00'
                AND down_to   > TIMESTAMPTZ '2025-01-01 00:00:00+00')
