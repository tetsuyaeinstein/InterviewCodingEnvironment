# Hand-written, fixture-based assertions (independent of the reference solution).
# Fixture customers are described in database/DATA_DICTIONARY.md.
assertions:
  - name: "customer 3 (exactly 5 consecutive days) is reported exactly once"
    present: {customer_id: 3}
    count: 1
  - name: "customer 2 (only 4 consecutive days) is not reported"
    absent: {customer_id: 2}
  - name: "customer 6 (6 purchases but only 4 consecutive distinct days) is not reported"
    absent: {customer_id: 6}
  - name: "customer 7 (5 days with several purchases per day) is reported once"
    present: {customer_id: 7}
    count: 1
  - name: "customer 5 (two separate 5-day runs) appears exactly once"
    present: {customer_id: 5}
    count: 1
  - name: "customer 4 (7-day run) is reported"
    present: {customer_id: 4}
  - name: "customer 8 (run across a month end) is reported"
    present: {customer_id: 8}
  - name: "customer 9 (run across a year end) is reported"
    present: {customer_id: 9}
  - name: "customer 10 (run across leap day 2024-02-29) is reported"
    present: {customer_id: 10}
  - name: "customer 11 (4 + 3 days around a skipped day) is not reported"
    absent: {customer_id: 11}
  - name: "customer 12 (middle day only CANCELLED) is not reported"
    absent: {customer_id: 12}
  - name: "customer 13 (consecutive in UTC dates) is reported"
    present: {customer_id: 13}
  - name: "guest checkouts (NULL customer_id) are excluded"
    absent: {customer_id: null}
  - name: "customer 1 (no transactions at all) is not reported"
    absent: {customer_id: 1}
