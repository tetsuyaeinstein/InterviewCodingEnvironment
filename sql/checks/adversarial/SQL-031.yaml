# Hand-written, fixture-based assertions (independent of the reference solution).
# Customer 50: EAST [2023-12-01, 2025-06-15 10:00), WEST [2025-06-15 10:00, 9999-12-31).
assertions:
  - name: "txn 5001 (customer 50, 2025-06-01) is attributed to the historical region EAST, while current_region is WEST"
    row: {transaction_id: 5001}
    count: 1
    expect: {customer_id: 50, region_at_purchase: EAST, segment_at_purchase: CONSUMER, current_region: WEST}
  - name: "txn 5002 (customer 50, 2025-06-15 09:59:59, one second before the change) is still EAST"
    row: {transaction_id: 5002}
    count: 1
    expect: {region_at_purchase: EAST}
  - name: "txn 5003 (customer 50, exactly 2025-06-15 10:00:00) already uses the NEW version WEST"
    row: {transaction_id: 5003}
    count: 1
    expect: {region_at_purchase: WEST}
  - name: "txn 5004 (customer 50, 2025-06-20) is WEST"
    row: {transaction_id: 5004}
    count: 1
    expect: {region_at_purchase: WEST, current_region: WEST}
  - name: "guest checkouts are returned with NULL historical attributes"
    sql: >-
      SELECT count(*) > 0 AND bool_and(region_at_purchase IS NULL AND segment_at_purchase IS NULL)
      FROM ({student}) s WHERE s.customer_id IS NULL
  - name: "exactly one row per completed June 2025 transaction (no rows dropped, no fan-out)"
    sql: >-
      SELECT (SELECT count(*) FROM ({student}) s) = (SELECT count(DISTINCT transaction_id) FROM ({student}) s)
         AND (SELECT count(*) FROM ({student}) s)
           = (SELECT count(*) FROM transactions
              WHERE transaction_status = 'COMPLETED'
                AND transaction_ts >= TIMESTAMPTZ '2025-06-01 00:00:00+00'
                AND transaction_ts <  TIMESTAMPTZ '2025-07-01 00:00:00+00')
  - name: "no non-COMPLETED transactions"
    sql: >-
      SELECT count(*) = 0 FROM ({student}) s JOIN transactions t USING (transaction_id)
      WHERE t.transaction_status <> 'COMPLETED'
